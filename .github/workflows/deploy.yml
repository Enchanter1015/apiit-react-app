name: Apiit Golden Path Application Pipeline

on:
  push:
    branches: [main]

env:
  AWS_REGION:  us-east-1
  TEAM:        Development
  ENVIRONMENT: prod
  PROJECT:     apiit-saas
  CATALOG_ORG: Enchanter1015
  CATALOG_VER: v2.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set app version from Git SHA
        run: echo "APP_VERSION=v$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Download catalog component
        run: |
          mkdir -p infra
          BASE=https://raw.githubusercontent.com/${{ env.CATALOG_ORG }}
          BASE=$BASE/golden-path-catalog/${{ env.CATALOG_VER }}/frontend/react-hosting
          curl -fsSL --show-error $BASE/hosting.yaml -o infra/hosting.yaml
          echo "Catalog ${{ env.CATALOG_VER }} downloaded"
          echo "Lines: $(wc -l < infra/hosting.yaml)"

      - name: Install and build React application
        run: |
          npm install
          REACT_APP_VERSION=${{ env.APP_VERSION }} \
          REACT_APP_TEAM=${{ env.TEAM }} \
          REACT_APP_ENVIRONMENT=${{ env.ENVIRONMENT }} \
          REACT_APP_CATALOG_VER=${{ env.CATALOG_VER }} \
          npm run build

      - name: Verify build output
        run: |
          echo "Build files: $(find build -type f | wc -l)"
          ls build/

      - name: Deploy hosting stack
        run: |
          aws cloudformation deploy \
            --template-file infra/hosting.yaml \
            --stack-name apiit-hosting-${{ env.ENVIRONMENT }}-${{ env.APP_VERSION }} \
            --parameter-overrides \
              Team=${{ env.TEAM }} \
              Environment=${{ env.ENVIRONMENT }} \
              ProjectName=${{ env.PROJECT }} \
              AppVersion=${{ env.APP_VERSION }} \
            --no-fail-on-empty-changeset

      - name: Sync assets to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name apiit-hosting-${{ env.ENVIRONMENT }}-${{ env.APP_VERSION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' \
            --output text)
          echo "Syncing to: $BUCKET"
          aws s3 sync build s3://$BUCKET --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST=$(aws cloudformation describe-stacks \
            --stack-name apiit-hosting-${{ env.ENVIRONMENT }}-${{ env.APP_VERSION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' \
            --output text)
          echo "Invalidating: $DIST"
          aws cloudfront create-invalidation \
            --distribution-id $DIST --paths '/*'

      - name: Print live URL
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name apiit-hosting-${{ env.ENVIRONMENT }}-${{ env.APP_VERSION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionURL`].OutputValue' \
            --output text)
          echo "========================================"
          echo "App version:     ${{ env.APP_VERSION }}"
          echo "Catalog version: ${{ env.CATALOG_VER }}"
          echo "Live at:         $URL"
          echo "========================================"